[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "executable-open-mic-laboratory"
version = "0.1.0"
description = "An executable textbook for live-performance experimentation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Open Mic Laboratory Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
open-mic-lab = "open_mic_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_mic_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
